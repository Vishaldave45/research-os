services:
  postgres:
    image: postgres:15-alpine
    container_name: researchos-db
    environment:
      POSTGRES_USER: researchos
      POSTGRES_PASSWORD: researchos_secret_password
      POSTGRES_DB: researchos_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U researchos -d researchos_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: researchos-api
    environment:
      DATABASE_URL: postgresql+asyncpg://researchos:researchos_secret_password@postgres:5432/researchos_db
      JWT_SECRET_KEY: dev_jwt_secret_key_change_in_production_32chars
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 15
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      CORS_ORIGINS: "http://localhost:3000,http://localhost:5173"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: researchos-ui
    environment:
      VITE_API_BASE_URL: "http://localhost:8000/api/v1"
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
